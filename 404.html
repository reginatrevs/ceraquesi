<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">

<title>Cera que sí · Muy pronto</title>

<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100dvh;display:grid;place-items:center;background:#D6CEBD;color:#1F1B18;font:16px/1.7 "Hanken Grotesk",system-ui,sans-serif;overflow:hidden;position:relative;isolation:isolate}
body::before{content:"";position:fixed;inset:-8%;z-index:-2;background:
  radial-gradient(50% 62% at 96% 2%, rgba(107,90,58,1), rgba(107,90,58,.85) 30%, transparent 70%),
  radial-gradient(34% 48% at 102% 70%, rgba(110,43,30,.92), transparent 72%),
  radial-gradient(56% 62% at -4% 104%, rgba(110,43,30,1), rgba(110,43,30,.8) 28%, transparent 70%),
  radial-gradient(42% 56% at 0% 8%, rgba(164,166,143,1), rgba(164,166,143,.7) 35%, transparent 72%),
  radial-gradient(40% 34% at 50% 50%, rgba(237,230,216,.96), rgba(237,230,216,.7) 50%, transparent 78%),
  #D6CEBD;filter:blur(36px)}
body::after{content:"";position:fixed;inset:0;z-index:-1;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .2  0 0 0 0 .14  0 0 0 .7 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");opacity:.38;mix-blend-mode:multiply;pointer-events:none}
main{padding:48px 28px;max-width:640px;text-align:center}
.k{font:12px "Courier Prime",monospace;letter-spacing:.2em;text-transform:uppercase;color:#6E2B1E;margin-bottom:26px}
img{width:min(78vw,440px);height:auto;display:block;margin:0 auto 44px}
h1{font:400 clamp(48px,9vw,88px)/.95 "Instrument Serif",Georgia,serif;color:#3A2A22;letter-spacing:-.01em}
h1 i{font-style:italic}
p.t{font:15px/1.8 "Courier Prime",monospace;color:#5E5247;margin:24px auto 36px;max-width:42ch}
a.b{display:inline-block;background:#3A2A22;color:#EDE6D8;text-decoration:none;padding:16px 28px;border-radius:999px;font:13px "Courier Prime",monospace;letter-spacing:.16em;text-transform:uppercase;border:1px solid #3A2A22;transition:background .15s,color .15s}
a.b:hover{background:transparent;color:#3A2A22}
a:focus-visible{outline:2px solid #6E2B1E;outline-offset:3px}
.c{margin-top:22px;font:13px "Courier Prime",monospace}
.c a{color:#3A2A22;text-underline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="k">Velas de cera de soya hechas a mano</p>
  <img src="img/logo.png" alt="Cera que sí">
  <h1>Muy <i>pronto</i></h1>
  <p class="t">Estamos preparando nuestra tienda en línea. Mientras tanto, síguenos y escríbenos por Instagram para hacer tu pedido navideño.</p>
  <a class="b" href="https://instagram.com/ceraquesi_mx" target="_blank" rel="noopener">@ceraquesi_mx</a>
  <p class="c">o escríbenos a <a href="mailto:ceraquesimx@gmail.com">ceraquesimx@gmail.com</a></p>
</main>
</body>
</html>
